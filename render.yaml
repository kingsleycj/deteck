# Render Blueprint (D-06, B-81): the website (which runs the background jobs too, for now), a
# nightly backup and Postgres, in Frankfurt. Cloudflare sits in front (DNS, TLS, WAF, Turnstile);
# files go to Cloudflare R2. Not deployed yet. docs/DEPLOY.md walks through the first deployment.
#
# Costs about $7.30 a month: the website is on Render's free plan, the database is $6.30 and the
# backup job $1. docs/DEPLOY.md, "Moving off the free plan", is the change to make before real
# pharmacies use DETECK.
#
# Settings Render can't know (your keys and addresses) are NOT listed here: Render ignores
# "fill this in" values inside an environment group. Before the first deploy, add them by hand in
# Render → Env Groups → deteck-shared (docs/DEPLOY.md, step 3, lists every one):
#   ORIGIN, EMAIL_FROM, RESEND_API_KEY, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID,
#   S3_SECRET_ACCESS_KEY, BACKUP_S3_BUCKET, SENTRY_DSN, CONTACT_EMAIL, EDGE_SECRET, and when you
#   use them: TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, ANTHROPIC_API_KEY, PILOT_ACCESS_CODE,
#   WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN.
# With NODE_ENV=production the app refuses to start, listing what's missing, rather than run with
# development fallbacks.
#
# Never change SERIAL_HMAC_KEY or BETTER_AUTH_SECRET after the first deploy, and keep a copy of
# both outside Render. The app refuses to start if they don't match the database.

envVarGroups:
  - name: deteck-shared
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      # No git hooks on Render.
      - key: HUSKY
        value: '0'
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SERIAL_HMAC_KEY
        generateValue: true
      - key: DEVICE_HASH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: EMAIL_DRIVER
        value: resend
      # The packaging photo check is open to everyone (B-83, 5 Nov 2026). Each check uses Claude
      # credit (about NGN 150); 'pilot' limits it to browsers that opened /pilot/<PILOT_ACCESS_CODE>,
      # 'off' turns it off.
      - key: FEATURE_PACKAGING_AI
        value: public
      # "Report a suspected fake" is switched off for now; 'on' brings back the form and pages.
      - key: FEATURE_REPORTS
        value: 'off'
      - key: SCAN_MODEL
        value: claude-opus-5-5
      - key: WHATSAPP_TEMPLATE_SUBSCRIBED
        value: deteck_alert_subscribed
      - key: WHATSAPP_TEMPLATE_RECALL
        value: deteck_recall_alert
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      # Languages on the public pages. All five were approved on 5 Nov 2026 (B-83).
      - key: LANGUAGES
        value: en,pcm,ha,yo,ig
      # The film on the landing page (a 1.25x-speed demo for now): files in apps/web/static/media.
      - key: SHOWREEL_URL
        value: /media/deteck-demo.mp4
      - key: SHOWREEL_POSTER
        value: /media/deteck-demo-poster.webp
      # Connections per process. Each website copy or worker uses up to this many plus about 5
      # (the job queue and reports); keep the total under the database plan's limit.
      - key: DATABASE_POOL_MAX
        value: '10'

services:
  - type: web
    name: deteck-web
    runtime: node
    region: frankfurt
    # Render's free plan for now (B-81). It sleeps after 15 minutes without visitors; the uptime
    # check on /healthz every 5 minutes keeps it awake, and the 750 free hours a month cover one
    # website running all month. It has no pre-deploy step and no Shell, and Render stops the old
    # copy 30 seconds into a deploy or restart (a longer maxShutdownDelaySeconds is refused). The
    # paid plan is 0.5c-512mb ($7 a month).
    plan: free
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # The free plan has no pre-deploy step, so migrations run just before the website starts. They
    # take a lock, so two copies starting together take turns. On the paid plan, move them back
    # to preDeployCommand.
    startCommand: node packages/core/scripts/migrate.ts && node apps/web/build/index.js
    healthCheckPath: /healthz
    envVars:
      - fromGroup: deteck-shared
      - key: DATABASE_URL
        fromDatabase:
          name: deteck-db
          property: connectionString
      # The website runs the background jobs itself for now (B-81). When use grows, add back a
      # worker service (plan 0.5c-512mb, buildCommand without `pnpm build`, startCommand
      # `node apps/worker/src/index.ts`, maxShutdownDelaySeconds 300, the same envVars) and set
      # this to 'false'.
      - key: JOBS_IN_WEB
        value: 'true'
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto
      # The visitor's address for the rate limits: once Cloudflare is in front, add
      # ADDRESS_HEADER=cf-connecting-ip together with EDGE_SECRET (SETUP-KEYS.md, section 4,
      # step 8). Without EDGE_SECRET anyone could type that header, so the app refuses to start
      # with one and not the other.
      # Manufacturer spreadsheets and reference photos. Public forms are capped at 20 MB in code.
      - key: BODY_SIZE_LIMIT
        value: 60M

  # Nightly backup of the whole database to a separate R2 bucket (BACKUP_S3_BUCKET), kept as long
  # as that bucket's rules say. Render's own backups only go back a few days.
  - type: cron
    name: deteck-backup
    runtime: node
    region: frankfurt
    # Billed by the second it runs, with Render's $1 a month minimum (there's no free cron plan).
    plan: 0.5c-512mb
    schedule: '30 1 * * *' # 02:30 in Lagos
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node packages/core/scripts/backup.ts
    envVars:
      - fromGroup: deteck-shared
      - key: DATABASE_URL
        fromDatabase:
          name: deteck-db
          property: connectionString

databases:
  - name: deteck-db
    region: frankfurt
    plan: 0.1c-256mb
    # Set on purpose: left out, Render gives this plan 15 GB, which took it from $6.30 to $10.50 a
    # month. Storage can grow later (to 5 GB, 10 GB and so on) but can never shrink.
    diskSizeGB: 1
    postgresMajorVersion: '18'
    databaseName: deteck
